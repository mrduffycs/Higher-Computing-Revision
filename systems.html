<style>
/* Plan: one study app per Higher unit, each in its textbook's colour; left rail of chapters, one readable column of learn-then-try blocks with in-page Python, web preview or SQL. */
:root {
  --bg: #ffffff;
  --surface: #f7f1ed;
  --surface-2: #efe4dd;
  --ink: #2b150d;
  --muted: #6b4a3c;
  --line: #e2d3ca;
  --accent: #c4572a;
  --accent-ink: #ffffff;
  --info: #2f6fb3;
  --good: #2e7d4f;
  --good-bg: #e6f3eb;
  --bad: #c0392b;
  --bad-bg: #fbe9e6;
  --warn: #b7791f;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #18100c; --surface: #241812; --surface-2: #32221a; --ink: #f6ede8; --muted: #c9ad9f; --line: #433025;
    --accent: #e8784a; --accent-ink: #1b0f0a; --info: #7fb2ea; --good: #6fcf97; --good-bg: #1d3326; --bad: #f08a7c; --bad-bg: #3a1f1a; --warn: #e3b25c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #18100c; --surface: #241812; --surface-2: #32221a; --ink: #f6ede8; --muted: #c9ad9f; --line: #433025;
  --accent: #e8784a; --accent-ink: #1b0f0a; --info: #7fb2ea; --good: #6fcf97; --good-bg: #1d3326; --bad: #f08a7c; --bad-bg: #3a1f1a; --warn: #e3b25c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 17px/1.55 var(--font-body); }
.layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); min-height: 100vh; }

.brand { font-family: var(--font-display); font-weight: 800; font-size: 19px; line-height: 1.15; padding: 0 10px 16px; }
.brand small { display: block; font: 700 11px/1.4 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
#nav { display: flex; flex-direction: column; gap: 2px; }
#nav a { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 14.5px; line-height: 1.3; }
#nav a:hover { background: var(--surface-2); }
#nav a.on { background: var(--accent); color: var(--accent-ink); }
#nav .num { font: 700 13px var(--font-mono); text-align: center; }
#nav .mini { font: 500 11.5px var(--font-mono); opacity: .75; }
#nav a.complete .mini { color: var(--good); opacity: 1; }
#nav a.on.complete .mini { color: inherit; }
main { padding: 36px clamp(16px, 4vw, 56px) 80px; max-width: 860px; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: clamp(28px, 4vw, 38px); line-height: 1.1; margin: 0 0 14px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 21px; margin: 0 0 8px; text-wrap: balance; }
.eyebrow { font-weight: 700; font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }

.mono, .code, .bit, .pv span { font-family: var(--font-mono); }

.exam { background: var(--surface-2); }
.prose { margin: 26px 0 10px; }
.prose p { margin: 8px 0; max-width: 68ch; }
.prose ol, .prose ul { padding-left: 22px; }
.pv { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px 0; }

.pv span.pt { background: transparent; color: var(--ink); min-width: 14px; }
.code { background: var(--surface); padding: 12px 14px; border-radius: 8px; overflow-x: auto; font-size: 14px; }
.tbl { border-collapse: collapse; margin: 10px 0; font-size: 15.5px; }
.tbl th, .tbl td { text-align: left; padding: 7px 14px 7px 0; border-bottom: 1px solid var(--line); }

.fig svg { width: 100%; min-width: 520px; height: auto; display: block; }

.task.is-shown { border-color: var(--warn); }
.task.is-marked { border-color: var(--info); }
.task-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
.tag { font: 700 12px var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.gen-tag { color: var(--info); }
.marks, .streak { font-size: 13px; color: var(--muted); }
.task.gen { border-style: dashed; border-color: var(--info); }
.q { margin: 0 0 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
button { font: inherit; cursor: pointer; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 9px; padding: 8px 18px; font-weight: 700; text-decoration: none; display: inline-block; }
.primary.big { padding: 12px 22px; font-size: 17px; }
.primary.danger { background: var(--bad); color: #fff; }
.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); border-radius: 9px; padding: 7px 14px; }
.ghost:hover { border-color: var(--muted); }
.link { background: none; border: 0; padding: 0; color: var(--info); text-decoration: underline; font-size: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }
.feedback { margin-top: 10px; font-weight: 700; min-height: 1em; }
.is-correct .feedback { color: var(--good); }
.hint { margin-top: 10px; padding: 10px 12px; background: var(--surface); border-radius: 8px; font-size: 15.5px; }

.answer-row input { width: min(240px, 100%); font-family: var(--font-mono); }
textarea { width: 100%; resize: vertical; }
input.gap { padding: 3px 6px; font-family: var(--font-mono); margin: 0 2px; }
.wrong { border-color: var(--bad) !important; background: var(--bad-bg) !important; }
.gap-text { line-height: 2.2; margin: 0; }
.bits { display: inline-block; overflow-x: auto; max-width: 100%; }
.bitrow { display: flex; gap: 5px; }
.bitrow.places { margin-bottom: 5px; }
.bitrow.places span { width: 46px; text-align: center; font: 700 13px var(--font-mono); color: var(--muted); }
.bit { width: 46px; height: 46px; border: 2px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 20px; font-weight: 700; padding: 0; }
.bit:hover { border-color: var(--accent); }
.bit.wrong { color: var(--bad); }
.is-correct .bit { border-color: var(--good); }
.fp { display: flex; flex-wrap: wrap; gap: 14px; }
.fp .bit { width: 30px; height: 38px; font-size: 16px; }
.fp .bitrow { gap: 3px; flex-wrap: wrap; }
.fp-label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 14px; text-align: left; }
.opt.picked { border-color: var(--accent); background: var(--surface-2); font-weight: 700; }
.match { display: grid; gap: 8px; }
.match-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 300px); gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.match-row select { width: 100%; }
.points { margin-top: 12px; }
.point { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.point input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); }
.score { font-weight: 700; color: var(--info); }
.rag-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rag-btns { display: flex; gap: 6px; flex-wrap: wrap; }

.rag-btn.r1.on { background: var(--warn); border-color: var(--warn); color: #fff; }

.pager a { color: var(--accent); font-weight: 700; text-decoration: none; }
.hero { padding: 10px 0 8px; }
.lede { font-size: 19px; max-width: 60ch; color: var(--muted); }
.hero-stats { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 18px 0 8px; }
.hero-stats b { font: 800 40px var(--font-display); display: block; line-height: 1; }
.hero-stats span { font-size: 14px; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin: 22px 0; }
.card { display: grid; gap: 8px; padding: 16px; border-radius: 14px; background: var(--surface); color: var(--ink); text-decoration: none; border: 1.5px solid transparent; }
.card:hover { border-color: var(--accent); }
.card .num { font: 700 13px var(--font-mono); color: var(--accent); }
.card .ct { font-weight: 700; line-height: 1.3; min-height: 2.6em; }
.card.complete .bar span { background: var(--good); }
.confirm { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.confirm[hidden] { display: none; }
.confirm p { margin: 0; font-weight: 700; }
.savebox { margin: 22px 4px 0; padding: 14px 12px; border-top: 1px solid var(--line); display: grid; gap: 8px; }
.save-title { margin: 0; font-weight: 700; font-size: 14px; }
.savebox .ghost, .load-label { font-size: 14px; text-align: center; padding: 7px 10px; background: var(--bg); cursor: pointer; display: block; }
.save-status { margin: 0; }
.load-confirm { display: grid; gap: 6px; font-size: 14px; }
.load-confirm[hidden] { display: none; }
.load-confirm p { margin: 0; }
.howto .save-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.editor { width: 100%; font: 14.5px/1.5 var(--font-mono); background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; tab-size: 4; white-space: pre; overflow-x: auto; resize: vertical; margin-top: 4px; }
.editor:focus { border-color: var(--accent); }
.stdin-label { display: grid; gap: 4px; margin-top: 10px; }
.stdin { font: 14px/1.4 var(--font-mono); width: min(360px, 100%); }
.console { background: #18100c; color: #d8f3e8; font: 14px/1.5 var(--font-mono); padding: 12px 14px; border-radius: 10px; white-space: pre-wrap; margin: 12px 0 0; max-height: 320px; overflow: auto; }
.console.err { color: #ffd0c8; }
.higher-note { margin-top: 12px; padding: 10px 14px; border-radius: 10px; background: color-mix(in srgb, var(--warn) 14%, var(--bg)); border: 1px solid var(--warn); font-size: 15px; }
.higher-note ul { margin: 6px 0 0; padding-left: 20px; }
.model { margin-top: 12px; }
.files { margin: 6px 0 10px; font-size: 15px; }
.files summary { cursor: pointer; color: var(--info); }
.files pre { max-height: 200px; overflow: auto; }
.mono-line { font-family: var(--font-mono); white-space: pre; font-size: 14.5px; overflow-x: auto; }
.trace-wrap { overflow-x: auto; }
.trace td, .trace th { padding: 6px 12px; border: 1px solid var(--line); }
.prose pre.code, .q pre.code { white-space: pre; }
button:disabled { opacity: .55; cursor: progress; }
.back { display: block; font-size: 13.5px; color: var(--muted); text-decoration: none; padding: 0 10px 12px; }
.back:hover { color: var(--accent); }
.web-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
.preview-wrap .small { margin: 0 0 4px; }
.preview { width: 100%; height: 360px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
.sql-out { margin-top: 12px; }
.result td, .result th { border: 1px solid var(--line); padding: 5px 10px; font-size: 14.5px; }
.result th { background: var(--surface); }
.dbview { margin: 16px 0; background: var(--surface); border-radius: 12px; padding: 12px 16px; }
.dbview summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.dbview h4 { margin: 14px 0 4px; }
@media (max-width: 820px) {
  .savebox { grid-template-columns: 1fr 1fr; margin: 10px 0 0; padding: 10px 0 0; }
  .save-title, .save-status, .load-confirm { grid-column: 1 / -1; }
  .layout { grid-template-columns: 1fr; }
  aside { position: static; height: auto; padding: 12px; border-right: 0; border-bottom: 1px solid var(--line); }
  .brand { padding-bottom: 8px; }
  #nav { flex-direction: row; overflow-x: auto; gap: 4px; }
  #nav a { grid-template-columns: auto; white-space: nowrap; }
  #nav .nt, #nav .mini { display: none; }
  .match-row, .rag-row { grid-template-columns: 1fr; }
  .bit { width: 34px; height: 40px; font-size: 17px; }
  .bitrow.places span { width: 34px; font-size: 11px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
// ---------- pure logic (tested in node) ----------
function toTwos(n, bits) {
  if (n < 0) n = n + 2 ** bits;
  let s = "";
  for (let i = 0; i < bits; i++) { s = (n % 2) + s; n = Math.floor(n / 2); }
  return s;
}
function toBinary(n, bits) { return toTwos(n, bits); }
function fromTwos(b) {
  let v = 0;
  const n = b.length;
  for (let i = 0; i < n; i++) {
    let p = 2 ** (n - 1 - i);
    if (i === 0) p = -p;
    if (b[i] === "1") v += p;
  }
  return v;
}
function fpEncode(x, m = 15, e = 8) {
  const sign = x < 0 ? "1" : "0";
  x = Math.abs(x);
  let exp = 0;
  while (x >= 1) { x /= 2; exp++; }
  while (x > 0 && x < 0.5) { x *= 2; exp--; }
  let mant = "";
  for (let i = 0; i < m; i++) { x *= 2; const d = Math.floor(x); mant += d; x -= d; }
  return { sign, mantissa: mant, exponent: toTwos(exp, e), exp };
}
function fpDecode(sign, mant, expBits) {
  const e = fromTwos(expBits);
  let m = 0;
  for (let i = 0; i < mant.length; i++) if (mant[i] === "1") m += 2 ** -(i + 1);
  return (sign === "1" ? -1 : 1) * m * 2 ** e;
}
function sameNumber(input, answer) {
  const clean = String(input).replace(/[\s,£]/g, "").replace(/bytes?$/i, "").replace(/−/g, "-");
  if (clean === "") return false;
  const v = Number(clean);
  return !Number.isNaN(v) && Math.abs(v - Number(answer)) < 1e-9;
}
function sameText(input, accepted) {
  const norm = (t) => String(t).toLowerCase().replace(/[^a-z0-9.\-]/g, "");
  return accepted.some((a) => norm(a) === norm(input));
}
function mulberry(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function seededShuffle(arr, seedText) {
  let seed = 0;
  for (const ch of seedText) seed = (seed * 31 + ch.charCodeAt(0)) | 0;
  const r = mulberry(seed);
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  if (a.every((v, i) => v === arr[i]) && a.length > 1) a.push(a.shift());
  return a;
}
if (false) module.exports = { toTwos, fromTwos, fpEncode, fpDecode, sameNumber, sameText, seededShuffle };

const BOOK = { key: "cs-higher-workbook-v1", tag: "computer-systems-workbook", file: "computer-systems", short: "Computer Systems",
  howto: ["<b>Bit grids</b>: click a bit to switch it between 0 and 1. Wrong bits turn red when you check."] };

font-weight=\"700\"><text x=\"412\" y=\"66\">Address bus</text><text x=\"412\" y=\"128\">Data bus</text><text x=\"412\" y=\"190\">Control lines</text></g><g text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:var(--muted)\"><text x=\"412\" y=\"96\">processor to memory</text><text x=\"412\" y=\"158\">both directions</text><text x=\"412\" y=\"220\">read, write, clock, reset</text></g></svg>";

const CHAPTERS = [
{
  id: "integers", num: 1, title: "Integers and two's complement",
  intentions: [
    "I can convert a positive binary number to denary",
    "I can represent a negative integer in two's complement",
    "I can convert a two's complement number to denary",

  ],
  recall: [],
  blocks: [
    { type: "text", html: `<h3>Binary place values</h3><p>Each bit has a place value that is a power of 2. To convert to denary, add the place values of every 1.</p>
      <div class="pv"><span>128</span><span>64</span><span>32</span><span>16</span><span>8</span><span>4</span><span>2</span><span>1</span></div>
      <p class="mono">00101101 = 32 + 8 + 4 + 1 = <b>45</b></p>` },
    { type: "num", id: "1a", q: "Convert <span class='mono'>01100100</span> to denary.", answer: 100, hint: "64 + 32 + 4" },
    { type: "num", id: "1b", q: "Convert <span class='mono'>01111111</span> to denary.", answer: 127, hint: "Add every place value from 64 down to 1." },
    { type: "text", html: `<h3>Two's complement</h3><p>To store negative numbers, the leftmost bit is given a <b>negative</b> place value. In 8 bits it is −128.</p>
      <div class="pv"><span class="neg">−128</span><span>64</span><span>32</span><span>16</span><span>8</span><span>4</span><span>2</span><span>1</span></div>
      <p class="mono">11010011 = −128 + 64 + 16 + 2 + 1 = <b>−45</b></p><p>A number starting with 0 is positive; a number starting with 1 is negative.</p>` },
    { type: "num", id: "1c", q: "Convert the 8-bit two's complement number <span class='mono'>10110110</span> to denary.", answer: -74, hint: "−128 + 32 + 16 + 4 + 2" },
    { type: "num", id: "1d", q: "Convert <span class='mono'>11111111</span> to denary.", answer: -1, hint: "−128 + 127" },
    { type: "num", id: "1e", q: "Convert <span class='mono'>10000000</span> to denary.", answer: -128 },
    { type: "text", html: `<h3>Denary to two's complement</h3><p>To represent −45 in 8 bits:</p>
      <ol><li>Write the positive number in binary: <span class="mono">00101101</span></li><li>Invert every bit: <span class="mono">11010010</span></li><li>Add 1: <span class="mono"><b>11010011</b></span></li></ol>
      <p>Click a bit to switch it between 0 and 1. The first task walks you through the steps; after that you are on your own.</p>` },
    { type: "bits", id: "1f", q: "<b>Step 1.</b> Write +27 in 8-bit binary.", n: 8, answer: toTwos(27, 8), places: "twos-pos" },
    { type: "bits", id: "1g", q: "<b>Step 2.</b> Invert every bit of your answer above.", n: 8, answer: "11100100", places: "none" },
    { type: "bits", id: "1h", q: "<b>Step 3.</b> Add 1. This is −27 in two's complement.", n: 8, answer: toTwos(-27, 8), places: "twos" },
    { type: "bits", id: "1i", q: "Represent <b>−100</b> in 8-bit two's complement.", n: 8, answer: toTwos(-100, 8), places: "twos", hint: "100 = 01100100. Invert, then add 1." },
    { type: "bits", id: "1j", q: "Represent <b>−1</b> in 8-bit two's complement.", n: 8, answer: toTwos(-1, 8), places: "twos" },
    { type: "gen", id: "g1", kind: "twos", title: "Practice machine: denary to two's complement" },
    { type: "gen", id: "g2", kind: "fromTwos", title: "Practice machine: two's complement to denary" },
    { type: "text", html: `<h3>Range</h3><p>With <i>n</i> bits, two's complement stores every whole number from <b>−2<sup>n−1</sup></b> to <b>2<sup>n−1</sup> − 1</b>. There is one more negative number than positive, because zero uses one of the patterns that start with 0.</p>` },
    { type: "num", id: "1k", q: "What is the smallest number that can be stored in 16-bit two's complement?", answer: -32768 },
    { type: "num", id: "1l", q: "What is the largest number that can be stored in 12-bit two's complement?", answer: 2047, hint: "2<sup>11</sup> − 1" },
  ],
  exam: [
    { type: "written", id: "1x", q: "State the range of integers that can be stored using 32-bit two's complement.", marks: 2, points: ["−2 147 483 648 (or −2<sup>31</sup>)", "2 147 483 647 (or 2<sup>31</sup> − 1)"] },
    { type: "written", id: "1y", q: "Explain why +128 cannot be stored in 8-bit two's complement.", marks: 1, points: ["The largest 8-bit value is 127; 10000000 represents −128, so +128 would overflow"] },
  ],
},
{
  id: "floating-point", num: 2, title: "Real numbers and floating point",
  intentions: [
    "I can convert between denary and binary fractions",
    "I can represent a real number in floating-point form",
    "I can convert a floating-point number to denary",
    "I can explain how bits affect range and precision",
  ],
  recall: [
    { type: "num", id: "2r1", q: "Recall: convert the 8-bit two's complement number <span class='mono'>11100101</span> to denary.", answer: -27 },
    { type: "num", id: "2r2", q: "Recall: what is the largest number in 8-bit two's complement?", answer: 127 },
  ],
  blocks: [
    { type: "text", html: `<h3>Binary fractions</h3><p>Places to the right of the point are halves, quarters, eighths and so on.</p>
      <div class="pv"><span>8</span><span>4</span><span>2</span><span>1</span><span class="pt">.</span><span>½</span><span>¼</span><span>⅛</span><span>1/16</span></div>
      <p class="mono">1101.11 = 8 + 4 + 1 + 0.5 + 0.25 = <b>13.75</b></p>` },
    { type: "num", id: "2a", q: "Convert <span class='mono'>101.1</span> to denary.", answer: 5.5 },
    { type: "num", id: "2b", q: "Convert <span class='mono'>0.011</span> to denary.", answer: 0.375 },
    { type: "gap", id: "2c", q: "Write 6.25 in binary.", text: "6.25 = {{110.01}}", hint: "6 = 110 and 0.25 = 0.01" },
    { type: "text", html: `<h3>Floating-point format</h3><p>This workbook uses the format in recent Higher marking instructions: a <b>sign bit</b> (0 positive, 1 negative), a <b>15-bit mantissa</b> with the point just before its first bit, and an <b>8-bit exponent</b> in two's complement.</p>
      <p>The mantissa is <b>normalised</b>: move the point until the mantissa starts with 1. The exponent says how many places it moved (positive if it moved left in the original number).</p>
      <p><b>Worked example: 13.75.</b> 13.75 = 1101.11 → .110111, the point moved 4 places left.<br>Sign <span class="mono">0</span> · mantissa <span class="mono">110111000000000</span> · exponent <span class="mono">00000100</span></p>` },
    { type: "gap", id: "2d", q: "<b>Guided:</b> 18.75 step by step.", text: "18.75 in binary = {{10010.11}} · normalised mantissa starts .{{1001011}} · the point moved {{5}} places", hint: "18 = 10010 and 0.75 = 0.11" },
    { type: "fp", id: "2e", q: "Now enter <b>18.75</b> in the floating-point grid.", value: 18.75 },
    { type: "fp", id: "2f", q: "Represent <b>−6.375</b>.", value: -6.375, hint: "6.375 = 110.011. Set the sign bit for a negative number." },
    { type: "fp", id: "2g", q: "Represent <b>0.1875</b>. The exponent will be negative.", value: 0.1875, hint: "0.1875 = 0.0011, so the point moves 2 places right: exponent −2 = 11111110." },
    { type: "text", html: `<h3>Floating point to denary</h3><p>Convert the exponent from two's complement, move the point that many places (right if positive, left if negative), convert, then apply the sign.</p><p>Sign 0 · mantissa 1011… · exponent 00000011 (3): .1011 → 101.1 = <b>5.5</b></p>` },
    { type: "num", id: "2h", q: "Convert to denary: sign <span class='mono'>1</span>, mantissa <span class='mono'>110000000000000</span>, exponent <span class='mono'>11111110</span>.", answer: -0.1875, hint: "The exponent is −2, so .11 becomes 0.0011." },
    { type: "gen", id: "g3", kind: "fp", title: "Practice machine: denary to floating point" },
    { type: "gen", id: "g4", kind: "fpToDen", title: "Practice machine: floating point to denary" },
    { type: "text", html: `<h3>Range and precision</h3><p>The total number of bits is fixed. More bits for the <b>mantissa</b> give more <b>precision</b> (more accurate numbers). More bits for the <b>exponent</b> give more <b>range</b> (larger and smaller numbers). Increasing one decreases the other.</p>` },
    { type: "gap", id: "2i", q: "Complete the sentences.", text: "More mantissa bits increase {{precision}}. More exponent bits increase {{range}}." },
  ],
  exam: [
    { type: "fp", id: "2x", q: "Show how <b>−11.625</b> would be stored using a sign bit, a 15-bit mantissa and an 8-bit exponent. (3 marks)", value: -11.625 },
    { type: "written", id: "2y", q: "A 32-bit format changes from 24 mantissa bits and 8 exponent bits to 20 mantissa bits and 12 exponent bits. Describe the effect.", marks: 2, points: ["Precision decreases: fewer mantissa bits, so numbers are stored less accurately", "Range increases: larger and smaller numbers can be stored"] },
  ],
},
{
  id: "text", num: 3, title: "Text: extended ASCII and Unicode",
  intentions: [
    "I can state how many characters a number of bits can represent",
    "I can explain the advantage and disadvantage of Unicode",
    "I can calculate the storage needed for text",
  ],
  recall: [
    { type: "bits", id: "3r1", q: "Recall: represent −99 in 8-bit two's complement.", n: 8, answer: toTwos(-99, 8), places: "twos" },
    { type: "choice", id: "3r2", q: "Recall: more exponent bits increase…", options: ["precision", "range", "neither"], correct: 1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Character sets</h3><p>The number of different characters is 2 to the power of the number of bits.</p>
      <table class="tbl"><tr><th>Code</th><th>Bits</th><th>Characters</th></tr><tr><td>ASCII</td><td>7</td><td>128</td></tr><tr><td>Extended ASCII</td><td>8</td><td>256</td></tr><tr><td>Unicode</td><td>16</td><td>65 536</td></tr><tr><td>Unicode</td><td>32</td><td>over 4 billion</td></tr></table>` },
    { type: "num", id: "3a", q: "How many different characters can 8-bit extended ASCII represent?", answer: 256 },
    { type: "num", id: "3b", q: "How many different characters can 16-bit Unicode represent?", answer: 65536 },
    { type: "text", html: `<h3>Why Unicode?</h3><p><b>Advantage:</b> far more characters, so every language, symbol and emoji can be represented. <b>Disadvantage:</b> each character takes more bits, so text needs more storage. Characters with codes above 255 cannot be stored in extended ASCII.</p>` },
    { type: "multi", id: "3c", q: "Select every character that needs Unicode (its code is above 255).", options: ["A (65)", "é (233)", "€ (8364)", "Ł (321)", "7 (55)", "☃ (9731)"], correct: [2, 3, 5] },
    { type: "text", html: `<h3>Storage</h3><p>Storage = number of characters × bits per character. 8 bits = 1 byte, 16 bits = 2 bytes, 32 bits = 4 bytes.</p>` },
    { type: "num", id: "3d", q: "A 500-character message is stored in 32-bit Unicode. How many bytes?", answer: 2000 },
    { type: "num", id: "3e", q: "A 1500-character message is stored in 16-bit Unicode. How many bytes?", answer: 3000 },
    { type: "gen", id: "g5", kind: "text", title: "Practice machine: text storage" },
  ],
  exam: [
    { type: "written", id: "3x", q: "Explain one advantage and one disadvantage of using Unicode instead of extended ASCII.", marks: 2, points: ["Advantage: many more characters, so all languages and symbols can be represented", "Disadvantage: more bits per character, so more storage is needed"] },
  ],
},
{
  id: "graphics", num: 4, title: "Graphics: bit-mapped and vector",
  intentions: [
    "I can describe how a bit-mapped graphic is stored",
    "I can describe the objects and attributes of a vector graphic",
    "I can compare bit-mapped and vector graphics",
  ],
  recall: [
    { type: "num", id: "4r1", q: "Recall: how many bytes does a 2000-character document need in 16-bit Unicode?", answer: 4000 },
    { type: "num", id: "4r2", q: "Recall: convert <span class='mono'>1101.11</span> to denary.", answer: 13.75 },
  ],
  blocks: [
    { type: "text", html: `<h3>Bit-mapped graphics</h3><p>A bit-mapped graphic is a grid of <b>pixels</b>, each storing a colour as a binary code. File size in bits = width × height × colour depth. Divide by 8 for bytes.</p><p class="mono">1920 × 1080 × 24 = 49 766 400 bits = 6 220 800 bytes</p>` },
    { type: "num", id: "4a", q: "An 800 × 600 image has a colour depth of 8 bits. What is its file size in bytes?", answer: 480000 },
    { type: "num", id: "4b", q: "What is that size in kilobytes? (1 KB = 1024 bytes)", answer: 468.75 },
    { type: "gen", id: "g6", kind: "bitmap", title: "Practice machine: bit-mapped file size" },
    { type: "text", html: `<h3>Vector graphics</h3><p>A vector graphic is a list of <b>objects</b> (rectangle, ellipse, line, polygon) and their <b>attributes</b> (coordinates, size, fill colour, line colour, line width). The computer redraws them at any size.</p>
      <pre class="code">&lt;ellipse cx="80" cy="70" rx="40" ry="40" fill="gold" stroke="orange" stroke-width="2"/&gt;</pre>` },
    { type: "multi", id: "4c", q: "Which of these are attributes of the ellipse above?", options: ["Fill colour: gold", "Number of pixels: 6400", "Line colour: orange", "Centre: (80, 70)", "Colour depth: 24 bits", "Line width: 2"], correct: [0, 2, 3, 5] },
    { type: "match", id: "4d", q: "Bit-mapped or vector? Choose for each statement.", options: ["Bit-mapped", "Vector"], items: [["Goes blocky when enlarged", 0], ["Each object can be moved separately", 1], ["Best for photographs", 0], ["File size depends on resolution and colour depth", 0], ["Resolution independent", 1], ["Stores attributes such as fill colour", 1]] },
  ],
  exam: [
    { type: "written", id: "4x", q: "A sports club's website has a logo and a gallery of match photos. Explain which type of graphic suits each.", marks: 2, points: ["Logo: vector, so it can be resized for different uses without losing quality", "Photos: bit-mapped, because they contain continuous, realistic colour"] },
  ],
},
{
  id: "fetch-execute", num: 5, title: "Computer structure and the fetch-execute cycle",
  intentions: [
    "I can state the role of the MAR, MDR, buses and control lines",
    "I can describe the four steps of the fetch-execute cycle",
  ],
  recall: [
    { type: "num", id: "5r1", q: "Recall: file size in bytes of a 100 × 100 image with 1-bit colour?", answer: 1250 },
    { type: "choice", id: "5r2", q: "Recall: which graphic type is resolution independent?", options: ["Bit-mapped", "Vector"], correct: 1 },
  ],
  blocks: [
    { type: "figure", html: FIG_CPU },
    { type: "match", id: "5a", q: "Match each part to its role.", options: ["Holds the address of the memory location to be accessed", "Holds data just read from, or about to be written to, memory", "Carries addresses from processor to memory (one way)", "Carries data both ways between processor and memory", "Carry signals such as read and write", "Carries out calculations and comparisons"], items: [["MAR", 0], ["MDR", 1], ["Address bus", 2], ["Data bus", 3], ["Control lines", 4], ["ALU", 5]] },
    { type: "text", html: `<h3>The fetch-execute cycle</h3><ol><li>The address of the next instruction is placed in the MAR and set up on the <b>address bus</b>.</li><li>The control unit activates the <b>read line</b>.</li><li>The instruction is transferred along the <b>data bus</b> to the <b>MDR</b>.</li><li>The instruction is <b>decoded</b> and <b>executed</b>.</li></ol><p>The cycle then repeats for the next instruction.</p>` },
    { type: "order", id: "5b", q: "Put the steps in order.", items: ["Address placed on the address bus", "Read line activated", "Instruction transferred along the data bus to the MDR", "Instruction decoded and executed"] },
    { type: "gap", id: "5c", q: "Complete the sentence.", text: "The address bus is one-directional because addresses only travel from the {{processor|cpu}} to {{memory|main memory|ram}}." },
  ],
  exam: [
    { type: "written", id: "5x", q: "Describe the four steps of the fetch-execute cycle.", marks: 4, points: ["The address is placed in the MAR / on the address bus", "The read line is activated", "The instruction is transferred along the data bus to the MDR", "The instruction is decoded and executed"] },
    { type: "written", id: "5y", q: "Explain why the data bus is bi-directional.", marks: 1, points: ["Data must be both read from and written to memory"] },
  ],
},
{
  id: "performance", num: 6, title: "Factors affecting performance",
  intentions: ["I can explain how cores, data bus width, cache and clock speed affect performance"],
  recall: [
    { type: "order", id: "6r1", q: "Recall: order the fetch-execute steps.", items: ["Address placed on the address bus", "Read line activated", "Instruction transferred to the MDR", "Instruction decoded and executed"] },
    { type: "num", id: "6r2", q: "Recall: what is <span class='mono'>11111111</span> in 8-bit two's complement?", answer: -1 },
  ],
  blocks: [
    { type: "text", html: `<h3>Four factors</h3><ul><li><b>More cores:</b> more instructions can be processed at the same time.</li><li><b>Wider data bus:</b> more bits can be transferred in each fetch from memory.</li><li><b>Larger cache:</b> frequently used instructions are held close to the processor, so there are fewer slower fetches from main memory.</li><li><b>Faster clock:</b> more fetch-execute cycles every second.</li></ul><p>A good answer says <i>why</i> a factor helps, not just that it does.</p>` },
    { type: "match", id: "6a", q: "Match each factor to the reason it improves performance.", options: ["More instructions processed at the same time", "More bits transferred in each fetch", "Fewer slower fetches from main memory", "More fetch-execute cycles per second"], items: [["More cores", 0], ["Wider data bus", 1], ["Larger cache", 2], ["Faster clock", 3]] },
    { type: "choice", id: "6b", q: "Which answer would earn the mark for cache?", options: ["Cache helps the computer go faster", "Cache holds frequently used instructions, reducing slower fetches from main memory", "Cache is a type of RAM"], correct: 1 },
    { type: "written", id: "6c", q: "Rewrite this weak answer so it earns the mark: <i>“A bigger data bus is better.”</i>", marks: 1, points: ["A wider data bus can transfer more bits in each fetch from memory"] },
  ],
  exam: [
    { type: "written", id: "6x", q: "A school is choosing between two computers: one has a larger cache, the other has more cores. Explain how each would improve performance.", marks: 2, points: ["Larger cache: frequently used instructions more likely to be in cache, reducing slower fetches from main memory", "More cores: more instructions can be processed at the same time"] },
    { type: "written", id: "6y", q: "Explain why doubling the number of cores does not always halve the time a program takes.", marks: 1, points: ["Only parts of a program that can be split into independent tasks can run on different cores at once"] },
  ],
},
{

  intentions: ["I can describe how intelligent heating, traffic control and car management systems reduce environmental impact"],

      <ul><li><b>Heating:</b> learns routines, turns down when the house is empty, can be switched off remotely, heats only occupied zones.</li><li><b>Traffic control:</b> adaptive traffic lights, variable speed limits, diversions around congestion.</li><li><b>Car management:</b> engine management adjusts the fuel mix, stop-start engines, eco-driving advice.</li></ul>` },
    { type: "match", id: "7a", q: "Which system is each feature from?", options: ["Heating", "Traffic control", "Car management"], items: [["Learns when rooms are used", 0], ["Variable speed limits", 1], ["Adjusts the fuel and air mix", 2], ["Turns down when everyone has left", 0], ["Adaptive traffic lights", 1], ["Stop-start engine", 2]] },

},
{
  id: "risks", num: 8, title: "Security risks",
  intentions: ["I can explain the risk of tracking cookies", "I can describe DoS symptoms, effects, costs, types and reasons"],
  recall: [
    { type: "written", id: "8r1", q: "Recall: describe one feature of a car management system that reduces emissions.", marks: 1, points: ["e.g. engine management adjusts the fuel mix / stop-start / eco-driving advice, reducing fuel use"] },
    { type: "fp", id: "8r2", q: "Recall: represent 5.5 in floating point.", value: 5.5 },
  ],
  blocks: [
    { type: "text", html: `<h3>Tracking cookies</h3><p>A tracking cookie is placed by a third party, usually an advertising company, whose adverts appear on many sites. Each visit is recorded, building a <b>profile</b> of the user's interests without their clear consent, used for <b>targeted adverts</b> and possibly <b>sold</b>.</p>` },
    { type: "order", id: "8a", q: "Put the events in order.", items: ["You view trainers on Site A", "An advertiser's cookie records the visit", "You visit Site B, which shows the same advertiser", "The cookie is read and trainer adverts are shown"] },
    { type: "text", html: `<h3>Denial of service (DoS)</h3><p>A DoS attack stops a service working for legitimate users, usually by overwhelming it. A <b>distributed</b> attack (DDoS) comes from thousands of computers.</p>
      <table class="tbl"><tr><th>Heading</th><th>What to know</th></tr><tr><td>Symptoms</td><td>Slow performance; unable to access</td></tr><tr><td>Effects</td><td>Disruption to users and businesses</td></tr><tr><td>Costs</td><td>Lost revenue; labour to fix; lost trust</td></tr><tr><td>Types</td><td>Bandwidth consumption; resource starvation; DNS</td></tr><tr><td>Reasons</td><td>Financial; political; personal</td></tr></table>` },
    { type: "match", id: "8b", q: "Which DoS heading does each statement belong under?", options: ["Symptom", "Cost", "Type", "Reason"], items: [["The website takes a minute to load", 0], ["Staff overtime to restore the service", 1], ["Resource starvation", 2], ["Protest against a company's policy", 3], ["Sales lost while the site is down", 1], ["Bandwidth consumption", 2]] },
    { type: "match", id: "8c", q: "Which type of attack is described?", options: ["Bandwidth consumption", "Resource starvation", "DNS attack"], items: [["The network connection is flooded with traffic", 0], ["The server's memory and connections are used up", 1], ["Browsers cannot look up the site's IP address", 2]] },
  ],
  exam: [
    { type: "written", id: "8x", q: "Explain how a tracking cookie can be a risk to a user's privacy.", marks: 2, points: ["It records the user's visits across many websites", "Building a profile of interests used for targeted adverts or sold, without clear consent"] },
    { type: "written", id: "8y", q: "An online shop is hit by a DoS attack during a sale. Describe two costs to the business.", marks: 2, points: ["Lost revenue from sales that could not be made", "Labour cost to investigate and repair / loss of customers' trust"] },
  ],
},
{
  id: "precautions", num: 9, title: "Security precautions",
  intentions: ["I can identify offences under the Computer Misuse Act 1990", "I can explain public key encryption", "I can explain digital signatures and certificates"],
  recall: [
    { type: "multi", id: "9r1", q: "Recall: select the two symptoms of a DoS attack.", options: ["Slow performance", "Lost revenue", "Unable to access the service", "Political protest"], correct: [0, 2] },
    { type: "num", id: "9r2", q: "Recall: how many bytes for 500 characters in 32-bit Unicode?", answer: 2000 },
  ],
  blocks: [
    { type: "text", html: `<h3>The Computer Misuse Act 1990</h3><ol><li><b>Unauthorised access</b> to computer material</li><li>Unauthorised access <b>with intent to commit a further offence</b></li><li><b>Unauthorised modification</b> of programs or data</li></ol><p>Individuals need permission; curiosity is no defence. Businesses must set clear access rights and policies, and can prosecute intruders.</p>` },
    { type: "match", id: "9a", q: "Which offence is each scenario?", options: ["Unauthorised access", "Access with intent to commit a further offence", "Unauthorised modification"], items: [["Reading a classmate's files using their guessed password", 0], ["Logging in to someone's bank account to transfer money", 1], ["Deleting a company's customer records", 2], ["Planting a virus on the school network", 2]] },
    { type: "text", html: `<h3>Encryption, signatures and certificates</h3><p><b>Public key encryption:</b> encrypt with the recipient's <b>public</b> key; only the recipient's <b>private</b> key can decrypt.</p><p><b>Digital signature:</b> the sender signs with <b>their own private</b> key; the recipient checks with the <b>sender's public</b> key. It proves who sent the message and that it was not changed.</p><p><b>Digital certificate:</b> issued by a trusted certificate authority to confirm that a public key belongs to a particular organisation. It holds the owner's name, public key, CA name, expiry date and CA signature.</p>` },

function placeRow(kind, n) {
  if (kind === "none") return "";
  const vals = [];
  for (let i = 0; i < n; i++) vals.push(2 ** (n - 1 - i));
  if (kind === "twos") vals[0] = "−" + vals[0];
  return `<div class="bitrow places">${vals.map((v) => `<span>${v}</span>`).join("")}</div>`;
}
function bitCells(group, n, values) {
  let h = "";
  for (let i = 0; i < n; i++) h += `<button type="button" class="bit" data-group="${group}" data-i="${i}" aria-label="${group} bit ${i + 1}">${values ? values[i] : "0"}</button>`;
  return h;
}

// ---------- reading answers ----------
const readBits = (node, g) => [...node.querySelectorAll(`.bit[data-group="${g}"]`)].map((x) => x.textContent).join("");
function markBits(node, g, answer) {
  node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => x.classList.toggle("wrong", x.textContent !== answer[i]));
}
function fillBits(node, g, answer) { node.querySelectorAll(`.bit[data-group="${g}"]`).forEach((x, i) => { x.textContent = answer[i]; x.classList.remove("wrong"); }); }

function evaluate(b, node) {
  switch (b.type) {
    case "num": { const v = node.querySelector("input").value; return { v, ok: sameNumber(v, b.answer) }; }
    case "gap": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "trace": {
      const ins = [...node.querySelectorAll("input.gap")];
      const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|"));
      const v = ins.map((i) => i.value);
      let ok = true;
      ins.forEach((inp, i) => { const good = sameText(inp.value, answers[i]); inp.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "bits": { const v = readBits(node, "b"); markBits(node, "b", b.answer); return { v: v.split(""), ok: v === b.answer }; }
    case "fp": {
      const a = fpEncode(b.value);
      const v = { s: readBits(node, "s").split(""), m: readBits(node, "m").split(""), e: readBits(node, "e").split("") };
      markBits(node, "s", a.sign); markBits(node, "m", a.mantissa); markBits(node, "e", a.exponent);
      return { v, ok: v.s.join("") === a.sign && v.m.join("") === a.mantissa && v.e.join("") === a.exponent };
    }
    case "multi": {
      const v = [...node.querySelectorAll(".opt.picked")].map((x) => Number(x.dataset.i));
      const ok = v.length === b.correct.length && b.correct.every((c) => v.includes(c));
      return { v, ok };
    }
    case "match": {
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = s.value !== "" && Number(s.value) === b.items[i][1]; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
    case "order": {
      const shown = seededShuffle(b.items, b.id);
      const sels = [...node.querySelectorAll("select")];
      const v = sels.map((s) => s.value);
      let ok = true;
      sels.forEach((s, i) => { const good = Number(s.value) === b.items.indexOf(shown[i]) + 1; s.classList.toggle("wrong", !good); if (!good) ok = false; });
      return { v, ok };
    }
  }
}
function revealAnswer(b, node) {
  switch (b.type) {
    case "num": node.querySelector("input").value = b.answer; break;
    case "gap": { const answers = [...b.text.matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "trace": { const answers = [...b.rows.flat().join("\u0001").matchAll(/\{\{([^}]+)\}\}/g)].map((m) => m[1].split("|")[0]); node.querySelectorAll("input.gap").forEach((inp, i) => { inp.value = answers[i]; inp.classList.remove("wrong"); }); break; }
    case "bits": fillBits(node, "b", b.answer); break;
    case "fp": { const a = fpEncode(b.value); fillBits(node, "s", a.sign); fillBits(node, "m", a.mantissa); fillBits(node, "e", a.exponent); break; }
    case "choice": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", Number(x.dataset.i) === b.correct)); break;
    case "multi": node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", b.correct.includes(Number(x.dataset.i)))); break;
    case "match": node.querySelectorAll("select").forEach((s, i) => { s.value = b.items[i][1]; s.classList.remove("wrong"); }); break;
    case "order": { const shown = seededShuffle(b.items, b.id); node.querySelectorAll("select").forEach((s, i) => { s.value = b.items.indexOf(shown[i]) + 1; s.classList.remove("wrong"); }); break; }
  }
}

// ---------- generators ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = (arr) => arr[rnd(0, arr.length - 1)];
const GEN = {
  twos() { const n = rnd(-128, -1); return { q: `Represent <b>${n}</b> in 8-bit two's complement.`, input: "bits", n: 8, answer: toTwos(n, 8) }; },
  fromTwos() { const n = rnd(-128, -1); return { q: `Convert <span class="mono">${toTwos(n, 8)}</span> to denary.`, input: "num", answer: n }; },
  fp() { const fr = pick([0, 0.5, 0.25, 0.75, 0.125, 0.375, 0.625, 0.875]); let v = rnd(0, 40) + fr; if (v === 0) v = 0.75; if (Math.random() < 0.4) v = -v; return { q: `Represent <b>${v}</b> in floating point (sign, 15-bit mantissa, 8-bit exponent).`, input: "fp", value: v }; },
  fpToDen() { const fr = pick([0.5, 0.25, 0.75, 0.125, 0.375]); let v = rnd(0, 20) + fr; if (Math.random() < 0.4) v = -v; const a = fpEncode(v); return { q: `Convert to denary: sign <span class="mono">${a.sign}</span>, mantissa <span class="mono">${a.mantissa}</span>, exponent <span class="mono">${a.exponent}</span>.`, input: "num", answer: v }; },
  text() { const c = pick([250, 500, 1200, 1500, 2000, 4000]); const bits = pick([8, 16, 32]); return { q: `How many bytes are needed for <b>${c}</b> characters in ${bits === 8 ? "8-bit extended ASCII" : bits + "-bit Unicode"}?`, input: "num", answer: (c * bits) / 8 }; },
  bitmap() { const w = pick([640, 800, 1024, 1280, 1920]); const h = pick([480, 600, 720, 768, 1080]); const d = pick([1, 8, 16, 24]); return { q: `What is the file size in <b>bytes</b> of a ${w} × ${h} image with a colour depth of ${d} bit${d > 1 ? "s" : ""}?`, input: "num", answer: (w * h * d) / 8 }; },

  predef() {
    const words = ["Glasgow", "Inverness", "Aberdeen", "Stirling", "Dundee", "Kirkwall", "Paisley"];
    const kind = pick(["mod", "int", "sub", "ord", "chr"]);
    if (kind === "mod") { const x = rnd(10, 99), y = rnd(2, 9); return { q: `What is <span class="mono">${x} % ${y}</span>?`, input: "num", answer: x % y }; }
    if (kind === "int") { const x = rnd(10, 99), y = rnd(2, 9); return { q: `What is <span class="mono">int(${x} / ${y})</span>?`, input: "num", answer: Math.floor(x / y) }; }
    if (kind === "sub") { const w = pick(words), a = rnd(0, 2), e = a + rnd(2, 4); return { q: `What is <span class="mono">"${w}"[${a}:${e}]</span>?`, input: "text", answer: w.slice(a, e) }; }
    if (kind === "ord") { const c = String.fromCharCode(pick([rnd(65, 90), rnd(97, 122)])); return { q: `What is <span class="mono">ord("${c}")</span>?`, input: "num", answer: c.charCodeAt(0) }; }
    const n = rnd(65, 90); return { q: `What is <span class="mono">chr(${n})</span>?`, input: "text", answer: String.fromCharCode(n) };
  },
  maxpos() {

    <p class="lede">Learn a little, try it straight away, get instant feedback. Every chapter starts with quick recall from earlier chapters and ends with exam practice and a confidence check.</p>
    <div class="hero-stats"><div><b>${done}</b><span>of ${total} tasks done</span></div><a class="primary big" href="#${next.id}">${done ? "Continue" : "Start"}: ${next.title}</a></div></header>
    <div class="cards">${CHAPTERS.map((c, i) => { const p = all[i]; const rag = S.rag[c.id] || []; const conf = rag.filter((x) => x === 2).length; return `<a class="card ${p.done === p.total ? "complete" : ""}" href="#${c.id}"><span class="num">${c.num}</span><span class="ct">${c.title}</span><span class="bar"><span style="width:${(100 * p.done) / p.total}%"></span></span><span class="small">${p.done}/${p.total} tasks${conf ? ` · ${conf}/${c.intentions.length} confident` : ""}</span></a>`; }).join("")}</div>
    <div class="howto"><h3>How it works</h3><ul><li><b>Try it</b> tasks check your answer instantly. After two tries you can see the answer.</li>${BOOK.howto.map((h) => `<li>${h}</li>`).join("")}<li><b>Practice machines</b> make a new question every time, so you can practise as much as you like.</li><li><b>Exam practice</b>: write your answer, then tick the marking points it makes.</li></ul>
    <h3>Keeping your progress</h3><p>This browser remembers your work, but only on this device, and a shared school computer may forget it when you log off. At the end of each lesson, <b>download your progress file</b> and keep it in your OneDrive or Google Drive. Next time, on any device, <b>load</b> it to carry on where you left off.</p>
    <div class="save-row"><button type="button" class="primary home-save">Download my progress</button><button type="button" class="ghost home-load">Load my progress</button></div>
    <p class="small">${S.savedAt ? `Last downloaded: ${new Date(S.savedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}.` : "You haven't downloaded a progress file yet."} <button type="button" class="link reset-btn">Reset my progress</button></p><div class="confirm" hidden><p>Clear every answer and start again?</p><button type="button" class="primary danger yes-reset">Yes, clear it</button><button type="button" class="ghost no-reset">Keep my progress</button></div></div>`;
  $main().querySelector(".home-save").onclick = () => document.getElementById("save-btn").click();
  $main().querySelector(".home-load").onclick = () => document.getElementById("load-file").click();
  $main().querySelector(".reset-btn").onclick = () => { $main().querySelector(".confirm").hidden = false; };
  $main().querySelector(".no-reset").onclick = () => { $main().querySelector(".confirm").hidden = true; };
  $main().querySelector(".yes-reset").onclick = () => { S = { tasks: {}, rag: {} }; save(); route(); };
}

function renderNav(active) {
  document.getElementById("nav").innerHTML = `<a href="#home" class="${active === "home" ? "on" : ""}"><span class="num">·</span>Overview</a>` + CHAPTERS.map((c) => { const p = progress(c); return `<a href="#${c.id}" class="${active === c.id ? "on" : ""} ${p.done === p.total ? "complete" : ""}"><span class="num">${c.num}</span><span class="nt">${c.title}</span><span class="mini">${p.done}/${p.total}</span></a>`; }).join("");
}

function refreshProgress(ch) {
  const p = progress(ch);
  const head = $main().querySelector(".ch-head");
  if (head) { head.querySelector(".bar span").style.width = (100 * p.done) / p.total + "%"; head.querySelector(".small").textContent = `${p.done} of ${p.total} tasks done`; }
  renderNav(ch.id);
}

function bindChapter(ch) {
  const all = [...ch.recall, ...ch.blocks, ...ch.exam];
  const byId = Object.fromEntries(all.filter((b) => b.id).map((b) => [b.id, b]));
  const m = $main();
  m.onclick = (e) => {
    const bit = e.target.closest(".bit");
    if (bit) { bit.textContent = bit.textContent === "1" ? "0" : "1"; bit.classList.remove("wrong"); return; }
    const gnode = e.target.closest(".task.gen");
    if (gnode) {
      if (e.target.closest(".gen-new")) newGen(gnode);
      else if (e.target.closest(".gen-check")) checkGen(gnode);
      else if (e.target.closest(".gen-show")) showGen(gnode);
      return;
    }
    const rb = e.target.closest(".rag-btn");
    if (rb) { const r = (S.rag[ch.id] = S.rag[ch.id] || []); r[Number(rb.dataset.i)] = Number(rb.dataset.j); save(); rb.parentNode.querySelectorAll(".rag-btn").forEach((x) => x.classList.toggle("on", x === rb)); return; }
    const node = e.target.closest(".task[data-id]");
    if (!node) return;
    const b = byId[node.dataset.id];
    const t = T(b.id);
    const fb = node.querySelector(".feedback");
    if (b.type === "code" || b.type === "web" || b.type === "sql") {
      const run = b.type === "code" ? (m) => codeRun(b, node, m) : b.type === "sql" ? (m) => sqlTask(b, node, m) : (m) => (m === "run" ? renderPreview(node, node.querySelector(".editor").value) : webCheck(b, node));
      if (e.target.closest(".run-btn")) run("run");
      else if (e.target.closest(".code-check")) Promise.resolve(run("check")).then(() => refreshProgress(ch));
      else if (e.target.closest(".reset-code")) { node.querySelector(".editor").value = b.starter || ""; t.v = b.starter || ""; save(); if (b.type === "web") renderPreview(node, t.v); }
      else if (e.target.closest(".model-btn")) { node.querySelector(".model").hidden = false; if (t.s !== "correct") { t.s = "shown"; node.classList.add("is-shown"); } save(); refreshProgress(ch); }
      return;
    }
    if (e.target.closest(".hint-btn")) { const hn = node.querySelector(".hint"); hn.hidden = !hn.hidden; return; }
    if (e.target.closest(".show-btn")) { revealAnswer(b, node); if (t.s !== "correct") t.s = "shown"; node.className = "task is-shown"; fb.textContent = "Answer shown. Try the next one on your own."; save(); refreshProgress(ch); return; }
    if (e.target.closest(".mark-btn")) {
      const pts = node.querySelector(".points");
      t.v = node.querySelector("textarea").value;
      if (pts.hidden) { pts.hidden = false; t.s = "marked"; t.ticks = t.ticks || []; node.classList.add("is-marked"); e.target.textContent = "Hide marking points"; pts.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`; }
      else { pts.hidden = true; e.target.textContent = "Mark my answer"; }
      save(); refreshProgress(ch); return;
    }
    const opt = e.target.closest(".opt");
    if (opt && b.type === "multi") { opt.classList.toggle("picked"); opt.setAttribute("aria-pressed", opt.classList.contains("picked")); return; }
    if (opt && b.type === "choice") {
      node.querySelectorAll(".opt").forEach((x) => x.classList.toggle("picked", x === opt));
      t.v = Number(opt.dataset.i); t.att++;
      if (t.v === b.correct) { t.s = t.s === "shown" ? "shown" : "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; }
      else { fb.textContent = "Not yet. Try another option."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch); return;
    }
    if (e.target.closest(".check-btn")) {
      const r = evaluate(b, node);
      t.v = r.v; t.att++;
      if (r.ok) { if (t.s !== "shown") t.s = "correct"; node.className = "task is-correct"; fb.textContent = "Correct."; node.querySelector(".show-btn").hidden = true; }
      else { fb.textContent = b.type === "bits" || b.type === "fp" ? "Not yet. The red bits are wrong; try again." : "Not yet. Check the highlighted answers and try again."; if (t.att >= 2) node.querySelector(".show-btn").hidden = false; }
      save(); refreshProgress(ch);
    }
  };
  m.onchange = (e) => {
    const cb = e.target.closest(".point input");
    if (!cb) return;
    const node = e.target.closest(".task[data-id]"); const b = byId[node.dataset.id]; const t = T(b.id);
    t.ticks = [...node.querySelectorAll(".point input")].map((x, i) => (x.checked ? i : -1)).filter((i) => i >= 0);
    node.querySelector(".score").textContent = `You gave yourself ${t.ticks.length} of ${b.marks}.`;
    save();
  };
  m.oninput = (e) => {
    const ta = e.target.closest("textarea");
    if (!ta) return;
    const t = T(ta.closest(".task").dataset.id);
    if (ta.classList.contains("stdin")) t.stdin = ta.value; else t.v = ta.value;
    save();
  };
  m.onkeydown = (e) => {
    const ed = e.target.closest("textarea.editor");
    if (ed && e.key === "Escape") { ed.dataset.leave = "1"; return; }
    if (ed && e.key === "Tab" && ed.dataset.leave === "1") { delete ed.dataset.leave; return; }
    if (ed && (e.key === "Tab" || e.key === "Enter") && !e.ctrlKey && !e.metaKey && !e.altKey) {
      delete ed.dataset.leave;
      const { selectionStart: a, selectionEnd: z, value } = ed;
      let insert;
      if (e.key === "Tab") {
        if (e.shiftKey) return;
        insert = "    ";
      } else {
        const lineStart = value.lastIndexOf("\n", a - 1) + 1;
        const line = value.slice(lineStart, a);
        const indent = line.match(/^ */)[0];
        insert = "\n" + indent + (/:\s*$/.test(line) ? "    " : "");
      }
      e.preventDefault();
      ed.value = value.slice(0, a) + insert + value.slice(z);
      ed.selectionStart = ed.selectionEnd = a + insert.length;
      ed.dispatchEvent(new Event("input", { bubbles: true }));
      return;
    }
    if (e.key === "Enter" && e.target.matches("input[type=text]")) { const n = e.target.closest(".task"); const btn = n && (n.querySelector(".check-btn") || n.querySelector(".gen-check")); if (btn) btn.click(); }
  };
}

// ---------- progress file ----------
const FILE_TAG = BOOK.tag;
function countDone(state) {
  return CHAPTERS.reduce((a, ch) => a + countable(ch).filter((b) => { const t = state.tasks[b.id]; return t && ["correct", "shown", "marked"].includes(t.s); }).length, 0);
}
const totalTasks = () => CHAPTERS.reduce((a, ch) => a + countable(ch).length, 0);
function setStatus(msg) { document.getElementById("save-status").textContent = msg; }

// Inside Claude, downloads go through the platform; on a self-hosted page, through an ordinary link.
let claudeDownloads = null;
try {
  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("downloads").then((d) => { claudeDownloads = d; }).catch(() => { claudeDownloads = null; });
  }
} catch (e) { claudeDownloads = null; }

document.getElementById("save-btn").onclick = async () => {
  const savedAt = new Date().toISOString();
  const data = JSON.stringify({ app: FILE_TAG, version: 1, savedAt, progress: Object.assign({}, S, { savedAt }) }, null, 1);
  const filename = `${BOOK.file}-progress-${savedAt.slice(0, 10)}.json`;
  const done = () => { S.savedAt = savedAt; save(); setStatus(`Saved ${countDone(S)} of ${totalTasks()} tasks to ${filename}. Keep it in your OneDrive or Google Drive.`); if (!location.hash || location.hash === "#home") route(); };
  if (claudeDownloads) {
    try { await claudeDownloads.save({ filename, data }); done(); }
    catch (err) {
      const code = err && err.code;
      if (code === "declined") setStatus("Download cancelled. Nothing was saved.");
      else if (code === "rate_limited") setStatus("A save is already waiting for you to confirm. Try again in a moment.");
      else setStatus("Downloads aren't available in this view. Open the workbook from your school's link to save a file.");
    }
    return;
  }
  try {
    const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    done();
  } catch (e) {
    setStatus("This browser blocked the download. Try another browser, or ask your teacher.");
  }
};

let pending = null;
document.getElementById("load-file").onchange = (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (d.app !== FILE_TAG || !d.progress || typeof d.progress.tasks !== "object") throw new Error("not ours");
      pending = { tasks: d.progress.tasks || {}, rag: d.progress.rag || {}, savedAt: d.progress.savedAt };
      const when = d.savedAt ? new Date(d.savedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "an unknown date";
      document.getElementById("load-summary").textContent = `This file was saved on ${when} and has ${countDone(pending)} of ${totalTasks()} tasks done. You have ${countDone(S)} done here.`;
      document.getElementById("load-confirm").hidden = false;
      setStatus("");
    } catch (err) {
      setStatus(`That file isn't a ${BOOK.short} progress file. Choose the .json file you downloaded from this workbook.`);
    }
  };
  reader.onerror = () => setStatus("The file couldn't be read. Try choosing it again.");
  reader.readAsText(file);
};
document.getElementById("load-yes").onclick = () => {
  if (!pending) return;
  S = pending; pending = null; save();
  document.getElementById("load-confirm").hidden = true;
  setStatus(`Progress loaded: ${countDone(S)} of ${totalTasks()} tasks done.`);
  route();
};
document.getElementById("load-no").onclick = () => { pending = null; document.getElementById("load-confirm").hidden = true; setStatus("Nothing changed."); };

function route() {
  const id = location.hash.replace("#", "");
  const ch = CHAPTERS.find((c) => c.id === id);
  renderNav(ch ? ch.id : "home");
  if (ch) renderChapter(ch); else renderHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();

</script>
</body>
